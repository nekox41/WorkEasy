name: Build and publish userscript release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build userscript
        run: npm run build
      - name: Verify release asset
        run: |
          test -s dist/workeasy.user.js
          node -e "const fs=require('fs'); const s=fs.readFileSync('dist/workeasy.user.js','utf8'); if(!/@version\\s+3\\.0\\.6/.test(s)) { console.error('Userscript version metadata does not match 3.0.6'); process.exit(1) }"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.6
          name: WorkEasy v3.0.6
          target_commitish: ${{ github.sha }}
          body: |
            ## WorkEasy 3.0.6

            - 使用已验证的任务查询参数，完整分页并按合同名称匹配。
            - 清理旧缓存，匹配到符合条件的任务即完成。
            - 首页仅显示统计按钮，实际统计内容放入弹窗。
            - 移除汇总方式，支持地区、负责人及归属地模糊组合筛选。
            - Release 仅包含可直接安装的油猴脚本。
          files: dist/workeasy.user.js
          fail_on_unmatched_files: true
